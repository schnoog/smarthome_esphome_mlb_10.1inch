text_sensor:
  - platform: homeassistant
    id: text_sensor_${uid}
    entity_id: ${entity_id}
    on_value:
      - logger.log:
          format: "Sensor ${entity_id}: '%s'"
          args: ['x.c_str()']

      - if:
          condition:
            lambda: 'return x == "${match}";'
          then:
            - logger.log: "-> MATCH"
            - lvgl.image.update:
                id: img_${uid}
                src: ${image_true}
          else:
            - logger.log: "-> NO MATCH"
            - lvgl.image.update:
                id: img_${uid}
                src: ${image_false}

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}_
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: ${radius | default(0)}
            clip_corner: true
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: img_${uid}
                  src: ${image_false}
                  align: center
                  clickable: false