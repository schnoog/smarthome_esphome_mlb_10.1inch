---
# Change page button
# Short click opens page_id page
#
# vars:
#   uid:          unique identifier
#   row:          grid row
#   column:       grid column
#   text:         tile label
#   icon:         icon glyph (required — e.g. $mdi_page_next or $mdi_page_previous)
#   row_span:     (default: 1)
#   column_span:  (default: 1)
#   background:   LVGL image id
#   page_id:      parent page (default: main_page)
#   click_page:   destination page name (default: main_page)

# This section adds a button to an LVGL page
lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  bg_opa: COVER
                  bg_image_src: ${background}
                  bg_image_opa: ${bg_image_opa | default("40%")}
                  on_short_click:
                    then:
                      lvgl.page.show: ${click_page | default("main_page")}
                  widgets:
                    - label:
                        id: label_${uid}
                        text: ${text}
                        align: bottom_left
                        x: 4
                        y: -4
                        # Feste helle Schrift statt Theme-Farbe
                        text_color: 0xFFFFFF
                        # Dunkle, halbtransparente Hinterlegung
                        bg_color: 0x000000
                        bg_opa: 55%
                        radius: 8
                        pad_left: 10
                        pad_right: 10
                        pad_top: 4
                        pad_bottom: 4
                        # Lange Texte kürzen statt überlaufen
                        long_mode: dot
                        max_width: 90%