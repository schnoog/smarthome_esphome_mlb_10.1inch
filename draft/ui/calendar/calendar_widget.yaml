# =====================================================================
#  Kalender-Widget (buttonmatrix) – füllt seinen Eltern-Container komplett
#
#  Einbindung als eigene Seite:
#
#    - id: cal_page
#      styles: page_style
#      on_unload:                       # beim Verlassen zurück auf aktuellen Monat
#        - homeassistant.action:
#            action: input_number.set_value
#            data:
#              entity_id: input_number.display_kalender_offset
#              value: "0"
#      widgets:
#        - !include ui/calendar/calendar_widget.yaml
#
#  Voraussetzung für die Monats-Buttons: In HA unter
#  Einstellungen > Geräte > ESPHome > (Gerät) > Optionen
#  "Gerät darf Home Assistant-Aktionen ausführen" aktivieren.
#
#  Fonts: Montserrat-Builtins haben keine Umlaute. Für "März" und
#  Terminnamen einen eigenen Font mit glyphsets (z.B. GF_Latin_Core)
#  verwenden und unten eintragen.
# =====================================================================
obj:
  id: cal_container
  width: 100%
  height: 100%
  bg_color: 0x1C1C1E
  radius: 16
  border_width: 0
  pad_all: 14
  scrollable: false
  layout:
    type: flex
    flex_flow: ROW
    pad_column: 16
  widgets:
    # ---------------- linke Seite: Monatsraster ----------------
    - obj:
        flex_grow: 2
        height: 100%
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: flex
          flex_flow: COLUMN
          pad_row: 6
        widgets:
          # Kopfzeile:  <   Oktober 2026   >
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: ROW
                flex_align_cross: CENTER
                pad_column: 8
              widgets:
                - button:
                    id: cal_prev_btn
                    width: 56
                    height: 56
                    radius: 28
                    bg_color: 0x2C2C2E
                    shadow_width: 0
                    text_color: 0xFFFFFF
                    text_font: montserrat_24
                    text: "\uF053"            # LV_SYMBOL_LEFT
                    pressed:
                      bg_color: 0x48484A
                    on_click:
                      - homeassistant.action:
                          action: input_number.decrement
                          data:
                            entity_id: input_number.display_kalender_offset

                # Tippen auf den Monatsnamen springt zurück zum aktuellen Monat
                - label:
                    id: cal_title_label
                    flex_grow: 1
                    text: "Kalender"
                    text_font: montserrat_28
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    clickable: true
                    on_click:
                      - homeassistant.action:
                          action: input_number.set_value
                          data:
                            entity_id: input_number.display_kalender_offset
                            value: "0"

                - button:
                    id: cal_next_btn
                    width: 56
                    height: 56
                    radius: 28
                    bg_color: 0x2C2C2E
                    shadow_width: 0
                    text_color: 0xFFFFFF
                    text_font: montserrat_24
                    text: "\uF054"            # LV_SYMBOL_RIGHT
                    pressed:
                      bg_color: 0x48484A
                    on_click:
                      - homeassistant.action:
                          action: input_number.increment
                          data:
                            entity_id: input_number.display_kalender_offset

          # Wochentags-Kopfzeile
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              pad_left: 4
              pad_right: 4
              scrollable: false
              layout:
                type: flex
                flex_flow: ROW
                pad_column: 4
              widgets:
                - label: { text: "Mo", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "Di", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "Mi", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "Do", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "Fr", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "Sa", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }
                - label: { text: "So", flex_grow: 1, text_align: CENTER, text_color: 0x8E8E93 }

          # Das eigentliche Raster – die Map wird von script cal_render ersetzt
          - buttonmatrix:
              id: cal_matrix
              width: 100%
              flex_grow: 1
              bg_opa: TRANSP
              border_width: 0
              pad_all: 4
              pad_row: 4
              pad_column: 4
              items:
                bg_color: 0x2C2C2E
                bg_opa: COVER
                text_color: 0xE5E5EA
                text_font: montserrat_24
                radius: 10
                border_width: 0
                shadow_width: 0
                checked:                 # Tag mit Termin(en)
                  bg_color: 0x0A84FF
                  text_color: 0xFFFFFF
                pressed:
                  bg_color: 0x48484A
              rows:
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
                - buttons: [{text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}, {text: "-"}]
              on_click:
                - lambda: |-
                    uint16_t b = lv_buttonmatrix_get_selected_button(id(cal_matrix)->obj);
                    if (b == LV_BUTTONMATRIX_BUTTON_NONE) return;
                    int day = (int) b - id(cal_offset) + 1;
                    if (day < 1 || day > id(cal_dim)) return;
                    id(cal_sel_day) = day;
                - script.execute: cal_show_day

    # ---------------- rechte Seite: Termine + Zurück-Button ----------------
    - obj:
        flex_grow: 1
        height: 100%
        bg_color: 0x2C2C2E
        radius: 12
        border_width: 0
        pad_all: 12
        scrollable: false
        layout:
          type: flex
          flex_flow: COLUMN
          pad_row: 10
        widgets:
          - label:
              id: cal_day_header
              text: "Termine"
              text_font: montserrat_24
              text_color: 0xFFB300

          # scrollbare Terminliste
          - obj:
              width: 100%
              flex_grow: 1
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scroll_dir: VER
              widgets:
                - label:
                    id: cal_event_list
                    width: 100%
                    long_mode: WRAP
                    text: ""
                    text_font: montserrat_20
                    text_color: 0xE5E5EA
                    text_line_space: 8

          # Zurück zur Startseite (unten rechts)
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: END
              widgets:
                - button:
                    id: cal_back_btn
                    height: 56
                    pad_left: 20
                    pad_right: 20
                    radius: 12
                    bg_color: 0x3A3A3C
                    shadow_width: 0
                    text_color: 0xFFFFFF
                    text_font: montserrat_20
                    text: "\uF015  Start"     # LV_SYMBOL_HOME
                    pressed:
                      bg_color: 0x48484A
                    on_click:
                      - lvgl.page.show: main_page
