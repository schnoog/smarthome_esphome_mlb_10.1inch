# ─────────────────────────────────────────────────────────────────────────────
# Home Assistant: in configuration.yaml (or your template/ package file)
# Collects events of the previous, current and next ~3 months and provides
# them as compact text lines in the attribute "events" for the ESPHome display.
#
# Colors on the display follow the ALPHABETICAL order of the calendar entities:
#   1st = orange, 2nd = blue, 3rd = green, 4th = pink, 5th = yellow, 6th = red
# ─────────────────────────────────────────────────────────────────────────────
template:
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie        # ← your calendars
            - calendar.muellabfuhr
        data:
          start_date_time: >-
            {{ (now().replace(day=1) - timedelta(days=1)).replace(day=1, hour=0, minute=0, second=0, microsecond=0).isoformat() }}
          duration:
            days: 130
        response_variable: cal
    sensor:
      - name: Display Kalender
        unique_id: display_kalender
        icon: mdi:calendar-month
        state: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
        attributes:
          events: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for c in cal.keys() | list | sort -%}
              {%- set i = loop.index0 -%}
              {%- for e in cal[c].events | default([]) -%}
                {%- set allday = 'T' not in e.start -%}
                {%- if allday -%}
                  {%- set s = as_datetime(e.start) -%}
                  {%- set en = as_datetime(e.end) - timedelta(days=1) -%}
                  {%- set t0 = '' -%}
                  {%- set t1 = '' -%}
                {%- else -%}
                  {%- set s = as_datetime(e.start) | as_local -%}
                  {%- set en = as_datetime(e.end) | as_local -%}
                  {%- set t0 = s.strftime('%H:%M') -%}
                  {%- set t1 = en.strftime('%H:%M') -%}
                {%- endif -%}
                {%- set title = (e.summary | default('') | replace('|', '/') | replace('\n', ' '))[:60] -%}
                {%- set ns.out = ns.out + [ i ~ '|' ~ s.strftime('%Y-%m-%d') ~ '|' ~ en.strftime('%Y-%m-%d') ~ '|' ~ t0 ~ '|' ~ t1 ~ '|' ~ title ] -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.out | join('\n') }}

# optional: keep the (large) attribute out of the database
recorder:
  exclude:
    entities:
      - sensor.display_kalender
