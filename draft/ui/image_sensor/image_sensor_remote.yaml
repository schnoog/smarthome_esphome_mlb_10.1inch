---
# Image sensor tile (numerisch)
# Zeigt je nach Sensorwert eines von zwei Bildern
#
# vars:
#   uid:          unique identifier
#   entity_id:    HA-Entität, z. B. "sensor.stromverbrauch"
#   row:          grid row
#   column:       grid column
#   threshold:    Vergleichswert, z. B. 100
#   image_true:   LVGL image id, wenn Bedingung erfüllt
#   image_false:  LVGL image id, wenn nicht erfüllt oder kein Wert
#   compare:      Operator: >=, >, <, <=, ==, != (default: >=)
#   row_span:     (default: 1)
#   column_span:  (default: 1)
#   page_id:      parent page (default: main_page)

sensor:
  - platform: homeassistant
    id: sensor_${uid}
    entity_id: ${entity_id}
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x) && (x ${compare | default(">=")} ${threshold});'
          then:
            - lvgl.image.update:
                id: img_${uid}
                src: ${image_true}
          else:
            - lvgl.image.update:
                id: img_${uid}
                src: ${image_false}

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - image:
                  id: img_${uid}
                  src: ${image_false}
                  align: center