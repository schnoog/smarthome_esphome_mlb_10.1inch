# ------------------------------------------------------------
# Sendspin Now Playing
#
# Required vars:
#   uid
#   row
#   column
#
# Optional vars:
#   row_span
#   column_span
#   page_id
#   cover_size
# ------------------------------------------------------------

text_sensor:

  - platform: sendspin
    id: ${uid}_title
    type: title
    on_value:
      then:
        - lvgl.label.update:
            id: ${uid}_title_label
            text: !lambda |-
              return x;

  - platform: sendspin
    id: ${uid}_artist
    type: artist
    on_value:
      then:
        - lvgl.label.update:
            id: ${uid}_artist_label
            text: !lambda |-
              return x;

  - platform: sendspin
    id: ${uid}_album
    type: album
    on_value:
      then:
        - lvgl.label.update:
            id: ${uid}_album_label
            text: !lambda |-
              return x;


#image:
#
#  - platform: sendspin
#    id: ${uid}_cover_slot
#    format: JPEG
#    type: RGB565
#    resize: ${cover_size}x${cover_size}

#    current_image:
#      id: ${uid}_cover


lvgl:

  pages:

    - id: !extend ${page_id | default("main_page")}

      widgets:

        - obj:
            id: ${uid}_container

            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}

            width: 100%
            height: 100%

            pad_all: 10

            bg_opa: TRANSP
            border_width: 0

            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER

            widgets:

              # ------------------------------------------------
              # Album Cover
              # ------------------------------------------------

 #             - image:
 #                 id: ${uid}_cover_widget
 #                 src: ${uid}_cover
 #                 width: ${cover_size}
 #                 height: ${cover_size}


              # ------------------------------------------------
              # Metadata
              # ------------------------------------------------

              - obj:
                  id: ${uid}_info

                  flex_grow: 1
                  height: 100%

                  bg_opa: TRANSP
                  border_width: 0

                  pad_left: 12
                  pad_right: 4

                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: START

                  widgets:

                    # Title
                    - label:
                        id: ${uid}_title_label
                        text: "Nothing playing"
                        width: 100%
#                        text_font: $text_font
#                        text_color: $label_on_color
#                        long_mode: SCROLL_CIRCULAR

                    # Artist
                    - label:
                        id: ${uid}_artist_label
                        text: ""
                        width: 100%
#                        text_font: $text_font
#                        text_color: $label_off_color
#                        long_mode: SCROLL_CIRCULAR

                    # Album
                    - label:
                        id: ${uid}_album_label
                        text: ""
                        width: 100%
#                        text_font: $text_font
#                        text_color: $label_off_color
#                        long_mode: SCROLL_CIRCULAR