---
# Remote sensor tile — displays a live value from a Home Assistant sensor entity.
# Read-only: no action scripts, no detail page.
#
# vars:
#   uid:          unique identifier
#   entity_id:    HA sensor entity, e.g. "sensor.outdoor_temperature"
#   attribute:    HA attribute to display instead of state (optional, default: state)
#   row:          grid row
#   column:       grid column
#   text:         sensor name shown on tile
#   icon:         icon glyph
#   bg_opa:       background opacity. 0%-100% or text TRANSP or COVER, for fully opaque (optional, default: COVER)
#   unit:         unit string appended to value, e.g. "°C"  (optional, default "")
#   precision:    decimal places                             (optional, default 1)
#   row_span:     (default: 1)
#   column_span:  (default: 1)
#   page_id:      parent page (default: main_page)
#   label_font:   font for the label
#   sensor_font:  font for the sensor value
#   temperature_entity: HA sensor entity for temperature
#   humidity_entity:    HA sensor entity for humidity
#   pressure_entity:    HA sensor entity for pressure
#   temperature_unit:   optional, default "°C"
#   humidity_unit:      optional, default "%"
#   pressure_unit:      optional, default "hPa"
#   precision:           decimal places (default 1)


globals:
- id: ${uid}_current_value
  type: float
  initial_value: '0.0'

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            bg_opa: ${bg_opa | default("COVER")}
            id: button_${uid}
            clickable: false
            widgets:
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                text_color: $icon_off_color
                text: ${icon}
                y: -10

            - label:
                id: label_${uid}
                align: top_mid
                long_mode: wrap
                width: 70%
                text_color: $label_off_color
                text_font: ${label_font | default(text_font)}
                text: ${text}
                y: -10
            - label:
                id: value_${uid}
                align: left_mid
                text_font: ${sensor_font | default(text_font)}
                text_color: $label_on_color
                text: "69.9 °C"
                y: -5
            - label:
                id: value_rh_${uid}
                align: right_mid
                text_font: nunito_24
                text_color: $label_on_color
                text: "12.3 %"
                y: +25
                x: -10
            - label:
                id: value_pr_${uid}
                align: bottom_right
                text_font: nunito_24
                text_color: $label_on_color
                text: "765.4 hPa"                                
                y: 5
                x: -10
# ── Subscribe to the HA sensor state ─────────────────────────────────────────

sensor:
  - platform: homeassistant
    id: ${uid}_temperature
    entity_id: ${temperature_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_${uid}
            text:
              format: "%.1f ${temperature_unit | default('°C')}"
              args: [ 'x' ]

  - platform: homeassistant
    id: ${uid}_humidity
    entity_id: ${humidity_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_rh_${uid}
            text:
              format: "%.1f ${humidity_unit | default('%%')}"
              args: [ 'x' ]

  - platform: homeassistant
    id: ${uid}_pressure
    entity_id: ${pressure_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_pr_${uid}
            text:
              format: "%.1f ${pressure_unit | default('hPa')}"
              args: [ 'x' ]