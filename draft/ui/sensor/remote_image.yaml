# Remote image tile (no button)
# Shows a periodically refreshed image from an HTTP source.
# The image is only refreshed while the parent page is visible;
# switching to the page triggers an immediate refresh.
#
# Requires a global `http_request:` component in the main config.
#
# vars:
#   uid:             unique identifier
#   row:             grid row
#   column:          grid column
#   image_url:       URL returning the image
#   image_format:    JPEG | PNG | BMP (default: JPEG)
#   update_interval: refresh interval (default: 10s)
#   image_width:     max. image width,  image is scaled to fit (default: 256)
#   image_height:    max. image height, image is scaled to fit (default: 150)
#   radius:          corner radius of the tile (default: 0)
#   row_span:        (default: 1)
#   column_span:     (default: 1)
#   page_id:         parent page (default: main_page)

# ─────────────────────────────────────────────────────────────────────────────
# Visibility tracking
# ─────────────────────────────────────────────────────────────────────────────

globals:
  - id: ${uid}_visible
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  # Periodic refresh, only while the parent page is shown
  - interval: ${update_interval | default("10s")}
    then:
      - if:
          condition:
            lambda: |-
              return lv_scr_act() == id(${page_id | default("main_page")})->obj;
          then:
            - component.update: ${uid}_remote

  # Detect the page becoming visible -> refresh immediately
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(${uid}_visible) &&
                     lv_scr_act() == id(${page_id | default("main_page")})->obj;
          then:
            - component.update: ${uid}_remote
      - lambda: |-
          id(${uid}_visible) =
              lv_scr_act() == id(${page_id | default("main_page")})->obj;

# ─────────────────────────────────────────────────────────────────────────────
# Image download
# ─────────────────────────────────────────────────────────────────────────────

image:
  - platform: online_image
    id: ${uid}_remote
    url: ${image_url}
    format: ${image_format | default("JPEG")}
    type: RGB565
    resize: ${image_width | default(256)}x${image_height | default(150)}
    # Refresh is driven by the intervals above
    update_interval: never
    on_download_finished:
      then:
        - lvgl.image.update:
            id: image_${uid}
            src: ${uid}_remote
    on_error:
      then:
        # Previous image stays visible, only log the failure
        - logger.log:
            level: WARN
            format: "Remote image for ${uid} failed"

# ─────────────────────────────────────────────────────────────────────────────
# LVGL tile
# ─────────────────────────────────────────────────────────────────────────────

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            # Plain black tile, image edge to edge
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            radius: ${radius | default(0)}
            clip_corner: true
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: image_${uid}
                  src: ${uid}_remote
                  align: center
                  clickable: false