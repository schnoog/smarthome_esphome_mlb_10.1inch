---
# History-Chart: Datenlogik + LVGL-Chart-Erzeugung fuer Sensor 1 (Pflicht).
# Holt beim Boot echte Historie von Home Assistant (REST History API) und
# puffert danach live weiter. Enthaelt SELBST KEINE Seite und KEINE
# Kachel - das eigentliche Chart-Widget kommt aus history_chart_widget.yaml,
# das du per !include direkt in eine BESTEHENDE Seite einfuegst (siehe
# example_wiring.yaml). Diese Trennung existiert bewusst: Eine eigene
# "pages: - id: ..."-Definition ueber mehrere !includes/packages hinweg
# hat bei main_page schon mal zu kaputter Grid-Validierung bei ANDEREN,
# unabhaengigen Widgets gefuehrt (vermutlicher Merge-Effekt) - das
# reine widgets:-Fragment umgeht das komplett.
#
# vars:
#   uid:                   eindeutige ID, z.B. "wz_klima"        (Pflicht,
#                         MUSS mit der uid von history_chart_widget.yaml
#                         uebereinstimmen!)
#   entity_1:             HA entity_id, Sensor 1                (Pflicht)
#   color_1:              Linienfarbe Sensor 1, Default "0x3498DB"
#   scale_1:              Multiplikator vor dem Runden (LVGL-Chart kennt
#                         nur Ganzzahlen!), Default 1
#   y_min / y_max:        Y-Achsenbereich (im skalierten Wertebereich), Default 0/100
#   sample_interval:      Mittelungsintervall als Dauer, Default "60s"
#   sample_interval_s:    dasselbe in Sekunden als Zahl, Default "60"
#   buffer_points:        max. gepufferte Werte, Default "1440" (=24h bei 60s)
#   point_count:          auf dem Display gezeichnete Punkte, Default "60"
#                         (MUSS mit point_count in history_chart_widget.yaml
#                         uebereinstimmen!)
#   ha_base_url:          z.B. "http://homeassistant.local:8123"  (Pflicht
#                         fuer die Historie-Abfrage)
#   history_lookback_hours:  wie weit rueckwirkend Historie geladen wird,
#                         Default "6". Braucht eine synchronisierte
#                         Systemzeit (irgendeine time:-Komponente, z.B.
#                         sntp) - ohne die wird die Abfrage uebersprungen
#                         und beim naechsten Interval-Tick erneut versucht.
#   history_max_response_bytes:  Puffer fuer die HTTP-Antwort UND Basis fuer
#                         die JSON-DOM-Groesse (wird intern *2 genutzt),
#                         Default "40960". Bei "IncompleteInput"-Fehlern im
#                         Log: history_lookback_hours verkleinern (wirkt
#                         staerker) und/oder diesen Wert erhoehen. Je nach
#                         Aktualisierungsrate des Sensors kann die 24h-
#                         Historie schnell >100 KB gross werden - deshalb
#                         der eingegrenzte Zeitraum statt HAs Standard "1 Tag".
#   history_max_response_bytes:  Puffer fuer die HTTP-Antwort, Default "24576"
#
# Voraussetzungen in DEINER Geraete-YAML (einmalig, nicht hier):
#   esphome:
#     platformio_options:
#       build_flags:
#         - "-D LV_USE_CHART=1"   # siehe Hinweis unten zu LVGL-Charts
#   http_request:
#   wifi:                          # (habt ihr sowieso schon)
#
# In secrets.yaml:
#   ha_long_lived_token: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9....."
#   (Wortlaut inkl. "Bearer " davor - wird 1:1 als Header-Wert verwendet)
#
# ---------------------------------------------------------------
# HINWEIS LVGL-Chart: ESPHome liefert den LVGL-Widget-Typ "chart"
# nicht deklarativ aus (Stand esphome/esphome#15895 - LV_USE_CHART
# wird in der generierten lv_conf.h auf 0 gesetzt). Das Chart wird
# daher per Lambda direkt ueber die LVGL-C-API erzeugt. Ob der oben
# genannte build_flags-Eintrag bei DEINER ESPHome-Version tatsaechlich
# zieht, ist nicht garantiert - deshalb unbedingt zuerst per SDL
# testen, bevor geflasht wird.
#
# HINWEIS Historie: Home Assistant liefert hier standardmaessig die
# letzten 24h (kein Start-Zeitstempel noetig, dafuer braucht's auch
# kein time:-Component auf dem ESP32). Fuer sehr "geschwaetzige"
# Sensoren (viele Aenderungen/Minute) kann die Antwort gross werden -
# im Zweifel history_max_response_bytes erhoehen; wird der Puffer
# ueberschritten, bricht das Parsen sauber ab und es wird nur lokal
# ab jetzt weiter gepuffert (kein Absturz, siehe Log-Ausgabe).
# ---------------------------------------------------------------

substitutions:
  color_1: "0x3498DB"
  scale_1: "1"
  y_min: "0"
  y_max: "100"
  sample_interval: "60s"
  sample_interval_s: "60"
  buffer_points: "1440"
  point_count: "60"
  history_max_response_bytes: "40960"
  history_lookback_hours: "6"
  unit_1: "°C"       # bei % bitte %% schreiben
  y_tick_count: "5"   # Anzahl beschrifteter Linien inkl. Min/Max


globals:
  - id: ${uid}_chart
    type: lv_obj_t *
    initial_value: "nullptr"
    restore_value: no
  - id: ${uid}_series1
    type: void *
    initial_value: "nullptr"
    restore_value: no
  - id: ${uid}_buf1
    type: std::vector<float>
  - id: ${uid}_range_minutes
    type: int
    initial_value: "${range_b_minutes}"
    restore_value: no

http_request:

sensor:
  - platform: homeassistant
    id: ${uid}_sensor_1
    entity_id: ${entity_1}
    internal: true
    force_update: true
    filters:
      - throttle_average: ${sample_interval}
    on_value:
      then:
        - lambda: |-
            id(${uid}_buf1).push_back(x * ${scale_1});
            if (id(${uid}_buf1).size() > ${buffer_points}) {
              id(${uid}_buf1).erase(id(${uid}_buf1).begin());
            }
        - script.execute: ${uid}_redraw_1

script:
  - id: ${uid}_redraw_1
    then:
      - lambda: |-
          lv_obj_t *chart = (lv_obj_t *) id(${uid}_chart);
          lv_chart_series_t *ser = (lv_chart_series_t *) id(${uid}_series1);
          if (chart == nullptr || ser == nullptr) return;
          auto &buf = id(${uid}_buf1);
          int have = (int) buf.size();
          if (have == 0) return;
          int range_min = id(${uid}_range_minutes);
          int wanted = (range_min * 60) / ${sample_interval_s};
          int use = wanted < have ? wanted : have;
          if (use < 1) use = 1;
          int pc = ${point_count};
          for (int i = 0; i < pc; i++) {
            int start_idx = have - use + (i * use) / pc;
            int end_idx   = have - use + ((i + 1) * use) / pc;
            if (start_idx < 0) start_idx = 0;
            if (end_idx <= start_idx) end_idx = start_idx + 1;
            if (end_idx > have) end_idx = have;
            float sum = 0;
            int n = 0;
            for (int j = start_idx; j < end_idx; j++) {
              sum += buf[j];
              n++;
            }
            float val = n > 0 ? (sum / n) : buf[have - 1];
            lv_chart_set_value_by_id(chart, ser, i, (int32_t) val);
          }
          lv_obj_invalidate(chart);

  - id: ${uid}_set_range
    parameters:
      minutes: int
    then:
      - globals.set:
          id: ${uid}_range_minutes
          value: !lambda "return minutes;"
      - script.execute: ${uid}_redraw_1

  - id: ${uid}_fetch_history_1
    then:
      - if:
          condition:
            lambda: "return ::time(nullptr) > 1700000000;"  # Systemzeit synchronisiert?
          then:
            - http_request.get:
                url: !lambda |-
                  time_t now_epoch = ::time(nullptr);
                  time_t start_epoch = now_epoch - (${history_lookback_hours} * 3600);
                  struct tm tm_start;
                  gmtime_r(&start_epoch, &tm_start);
                  char start_buf[25];
                  strftime(start_buf, sizeof(start_buf), "%Y-%m-%dT%H:%M:%SZ", &tm_start);
                  return std::string("${ha_base_url}") + "/api/history/period/" + start_buf
                    + "?filter_entity_id=${entity_1}&minimal_response&no_attributes";
                request_headers:
                  Authorization: !secret ha_long_lived_token
                max_response_buffer_size: ${history_max_response_bytes}
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("history_chart", "HA-History (${uid}, Sensor 1): HTTP %d", response->status_code);
                          return;
                        }
                        JsonDocument doc;
                        DeserializationError err = deserializeJson(doc, body);
                        if (err) {
                          ESP_LOGW("history_chart", "HA-History (${uid}, Sensor 1): JSON-Fehler: %s (history_lookback_hours verkleinern oder history_max_response_bytes vergroessern)", err.c_str());
                          return;
                        }
                        JsonArray outer = doc.as<JsonArray>();
                        if (outer.size() == 0) {
                          ESP_LOGW("history_chart", "HA-History (${uid}, Sensor 1): leere Antwort");
                          return;
                        }
                        JsonArray states = outer[0].as<JsonArray>();
                        auto &buf = id(${uid}_buf1);
                        buf.clear();
                        for (JsonObject st : states) {
                          const char *state_str = st["state"] | "";
                          if (state_str[0] == '\0'
                              || strcmp(state_str, "unknown") == 0
                              || strcmp(state_str, "unavailable") == 0) {
                            continue;
                          }
                          buf.push_back((float) atof(state_str) * ${scale_1});
                          if (buf.size() > ${buffer_points}) buf.erase(buf.begin());
                        }
                        ESP_LOGI("history_chart", "${uid}: %d Verlaufswerte (Sensor 1) von Home Assistant geladen", (int) buf.size());
                    - script.execute: ${uid}_redraw_1
                on_error:
                  then:
                    - logger.log:
                        format: "HA-History (${uid}, Sensor 1): Anfrage fehlgeschlagen"
                        tag: "history_chart"
          else:
            - logger.log:
                format: "${uid}: Systemzeit noch nicht synchron - History-Abfrage (Sensor 1) uebersprungen, naechster Versuch folgt"
                tag: "history_chart"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            lv_obj_t *placeholder = id(${uid}_placeholder);
            lv_obj_set_flex_flow(placeholder, LV_FLEX_FLOW_ROW);
            lv_obj_set_style_pad_all(placeholder, 0, 0);
            lv_obj_set_style_pad_column(placeholder, 4, 0);

            // --- Achsen-Spalte: gestapelte Labels statt Scale-Widget ---
            lv_obj_t *axis = lv_obj_create(placeholder);
            lv_obj_remove_style_all(axis);
            lv_obj_set_size(axis, 42, lv_pct(100));
            lv_obj_set_flex_flow(axis, LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(axis, LV_FLEX_ALIGN_SPACE_BETWEEN, LV_FLEX_ALIGN_END, LV_FLEX_ALIGN_CENTER);
            lv_obj_set_style_pad_all(axis, 0, 0);

            const int n_labels = ${y_tick_count};
            for (int i = n_labels - 1; i >= 0; i--) {
              int val = ${y_min} + i * (${y_max} - ${y_min}) / (n_labels - 1);
              lv_obj_t *lbl = lv_label_create(axis);
              lv_label_set_text_fmt(lbl, "%d${unit_1}", val);
            }

            // --- Chart ---
            lv_obj_t *chart = lv_chart_create(placeholder);
            lv_obj_set_flex_grow(chart, 1);
            lv_obj_set_height(chart, lv_pct(100));
            lv_chart_set_type(chart, LV_CHART_TYPE_LINE);
            lv_chart_set_div_line_count(chart, n_labels - 1, 0);
            lv_chart_set_point_count(chart, ${point_count});
            lv_chart_set_update_mode(chart, LV_CHART_UPDATE_MODE_SHIFT);
            lv_chart_set_range(chart, LV_CHART_AXIS_PRIMARY_X, 0, ${point_count});
            lv_chart_set_range(chart, LV_CHART_AXIS_PRIMARY_Y, ${y_min}, ${y_max});

            id(${uid}_chart) = chart;
            id(${uid}_series1) = (void *) lv_chart_add_series(
              chart, lv_color_hex(${color_1}), LV_CHART_AXIS_PRIMARY_Y
            );
    - priority: -200
      then:
        - delay: 5s
        - logger.log:
            format: "${uid}: starte erste HA-History-Abfrage (Sensor 1)"
            tag: "history_chart"
        - script.execute: ${uid}_fetch_history_1

# Falls die erste Abfrage fehlschlaegt (z.B. WLAN/HA noch nicht bereit,
# oder unter SDL noch keine Route zu ha_base_url), einfach alle 5 Minuten
# erneut versuchen - hoert automatisch auf, sobald Daten da sind.
interval:
  - interval: 5min
    then:
      - if:
          condition:
            lambda: "return id(${uid}_buf1).empty();"
          then:
            - logger.log:
                format: "${uid}: Puffer (Sensor 1) noch leer - erneuter History-Versuch"
                tag: "history_chart"
            - script.execute: ${uid}_fetch_history_1

# Die eigentlichen LVGL-Widgets (Chart-Platzhalter + Zeitraum-Buttons)
# liegen jetzt in history_chart_widget.yaml - dort per !include direkt
# als Element in die widgets:-Liste EINER BESTEHENDEN Seite einfuegen,
# siehe example_wiring.yaml.
