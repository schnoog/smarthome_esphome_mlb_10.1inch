###sendspin:
###  id: sendspin_hub
###  task_stack_in_psram: false

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
###  - platform: sendspin
###    id: sendspin_media_source


media_player:
###  - platform: sendspin
###    id: sendspin_group_media_player
  - platform: speaker_source
    name: "Media Player"
    id: my_media_player
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_media_source
###        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.75









# This is the main LVGL section. We start with a simple grid.
lvgl:
  buffer_size: 100%
  pages:
    - id: main_page
      layout: 4x9
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml

    - id: second_page
      layout: 4x9
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      

  top_layer:
    widgets:
      - obj:
          id: incoming_call_popup
          hidden: true
          width: 880
          height: 440
          align: CENTER
          radius: 12
          bg_color: 0x1E1E1E
          bg_opa: COVER
          border_width: 2
          border_color: 0x00AAFF
          widgets:
            - label:
                text: "Eingehender Anruf"
                text_font: nunito_48   # an deine geladenen Fonts anpassen
                align: CENTER
                y: -100

            - label:
                id: icon_phone
                text_font: mdi_icons_40
                align: CENTER
#                x: 0
                y: -20
                text: $mdi_phone
          

            - label:
                id: caller_id_label
                text: "..."
                text_font: nunito_48
                align: CENTER
                y: 50
 #               x: 20
            # Falls die Komponente Answer/Hangup-Actions bietet:
            - button:
              #  x: -20
                y: -15
                width: 120
                height: 50                
                align: BOTTOM_MID
                widgets:
                  - label:
                      text: "Ablehnen"
                on_click:
                  - lambda: |-
                      // id(sip).hangup();  // Methode/Signatur prüfen!
                  - lvgl.widget.hide: incoming_call_popup



