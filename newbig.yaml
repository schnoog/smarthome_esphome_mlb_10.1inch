switch:
  # Controls panel power for LCD and touch
#  - platform: gpio
#    pin: GPIO29
#    id: display_power
#    name: "Display Power"
#    restore_mode: ALWAYS_ON

  # Amplifier power (active‑low on this board)

  # Microphone routing switch (R/L channel selection on the board)

###sendspin:
###  id: sendspin_hub
###  task_stack_in_psram: false

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
###  - platform: sendspin
###    id: sendspin_media_source


media_player:
###  - platform: sendspin
###    id: sendspin_group_media_player
  - platform: speaker_source
    name: "Media Player"
    id: my_media_player
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_media_source
###        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.75









# This is the main LVGL section. We start with a simple grid.
lvgl:
  buffer_size: 100%
  pages:
    - id: main_page
      layout: 4x8
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml

    - id: media_page
      layout: 4x8
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      


    - id: heating_page
      layout: 4x8
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      

    - id: solar_page
      layout: 4x8
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      


    - id: cal_page
      layout: 6x8
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      

    - id: cam_page
      layout: 4x6 
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      





  top_layer:
    widgets:
      - obj:
          id: incoming_call_popup
          hidden: true
          width: 880
          height: 440
          align: CENTER
          radius: 12
          bg_color: 0x1E1E1E
          bg_opa: COVER
          border_width: 2
          border_color: 0x00AAFF
          widgets:
#mdi_phone

            - label:
                text: "Eingehender Anruf"
                text_font: nunito_48   # an deine geladenen Fonts anpassen
                align: CENTER
                y: -100

            - label:
                id: icon_phone
                text_font: mdi_icons_40
                align: CENTER
