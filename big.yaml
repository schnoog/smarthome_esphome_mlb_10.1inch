rtttl:
  speaker: my_speaker
  id: my_rtttl
  gain: 0.8


external_components:
  - source: github://eigger/espcomponents@latest
    components: [ sip_client ]
#    refresh: always

# Basic VoIP/SIP Setup
sip_client:
  microphone: pdm_mic
  speaker: my_speaker
  server: "192.168.178.1"
  username: "esphome-client1"
  password: !secret sippass

  on_registered:
    - logger.log: "SIP registriert"
  on_incoming_call:
    - rtttl.play: 'Loewenzahn:d=4,o=5,b=225:4f5,8g5,8a5,4p,8a5,4p,4a5,8g5,8f5,8p,4c5.,2p,4f5,8g5,8a5,4p,8a5,4p,4a5,8g5,4f5,4c6.,2p,4p,4c6,8d6,8d#6,4p,8d#6,4p,4d#6,8d6,4c6,8a#5,4p,8a#5,4p,8a#5,4f5,8g5,8g#5,8p,4g5.,2p,4d6,8g6'

  #'Loewenzahn:d=4,o=5,b=225:4f5,8g5,8a5,4p,8a5,4p,4a5,8g5,8f5,8p,4c5.,2p,4f5,8g5,8a5,4p,8a5,4p,4a5,8g5,4f5,4c6.,2p,4p,4c6,8d6,8d#6,4p,8d#6,4p,4d#6,8d6,4c6,8a#5,4p,8a#5,4p,8a#5,4f5,8g5,8g#5,8p,4g5.,2p,4d6,8g6'
  #'AlfredJQ:d=8,o=5,b=125:g,c6,c6,c6,c6,g,g,p,g,a,a,p,a,e,e,p,e,f,d,f,d,a,g,p,g,c,d,e,g,4c6,p,g,c6,c6,c6,c6,g,g,p,g,a,a,p,a,e,e,p,e,f,d,f,d,a,g,p,g,c,d,e,g,4c6,p,c6,c#6,c#6,c#6,c#6,g#,g#,p,g#,a#,a#,a#,a#,f,f,p,f,d#,f,f#,d#,a#,g#,p,g#,c#,d#,f,g#,4c#6,p,g#,c#6,c#6,c#6,c#6,g#,g#'

    - logger.log:
        format: "Playing ringtone....Incoming call from %s"
        args: [caller.c_str()]
    - lvgl.label.update:
        id: caller_id_label
        text: !lambda 'return caller;'
    - lvgl.widget.show: incoming_call_popup
  on_call_connected:
    - rtttl.stop
    - lvgl.widget.hide: incoming_call_popup
    - mqtt.publish:
        topic: "fritzbox/phonecall"
        payload: "0"    
  on_call_ended:
    - rtttl.stop
    - lvgl.widget.hide: incoming_call_popup
    - mqtt.publish:
        topic: "fritzbox/phonecall"
        payload: "0"    
  on_dtmf:
    - logger.log:
        format: "Received DTMF %s"
        args: [digit.c_str()]


mqtt:
  id: esp32sip_client1_BigDisplay
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  birth_message:
  will_message:
  shutdown_message:





# Time update script - This is run once per second. Use it to update any time related labels.
script:
  # --------------------------------------------------------------------------
  # This script is called once per minute.
  # Any packages in this library will !extend time_update to update their own labels.
  # You can add code here to update your own custom labels.
  # --------------------------------------------------------------------------
  - id: time_update
    then:
      - lambda: |-
          // No operation

packages:
  # Generic configuration for ESP32 screens
  # Include Wi-Fi support
  wifi: !include esphome-modular-lvgl-buttons/common/wifi.yaml
  # Enable OTA updates with a status screen
  ota_screen: !include esphome-modular-lvgl-buttons/common/ota.yaml
   # Some basic sensors
  sensors: !include esphome-modular-lvgl-buttons/common/sensors_base.yaml
  # Styles + Themes + Some nice basic fonts + 1000s of glyphs + all the colors
  theme:  !include esphome-modular-lvgl-buttons/common/theme/index.yaml
  # Use this theme for debugging
  # theme:  !include esphome-modular-lvgl-buttons/common/theme/index_debug.yaml  # uncomment to enable debug outlines
  # Include if your touch screen has a backlight. Also sets the time from HA
  backlight: !include esphome-modular-lvgl-buttons/common/backlight_time.yaml
  # Popup system — code for popup pages lives here, but the popups themselves are defined in the UI section below
  popup_system: !include esphome-modular-lvgl-buttons/ui/popup/popup_system.yaml
  
  # Hardware description file
  hardware: !include
    file: esphome-modular-lvgl-buttons/hardware/crowpanel-adv-10.1inch-esp32p4-hmi.yaml
    vars:
      rotation: "0"  # set screen rotation 0, 90, 180, 270
  # Media Player and Voice Assistant
  #media_voice: !include esphome-modular-lvgl-buttons/hardware/media_player-voice_assistant.yaml

  # Basic boot screen with ESPHome logo and device diagnostic info
  loading_screen: !include esphome-modular-lvgl-buttons/pages/loading.yaml
  # info screen - WiFi login, IP address, MAC address etc
  info_screen: !include esphome-modular-lvgl-buttons/pages/info.yaml

  # This section will add buttons and page to your screen using the ESPHome package system.
  # Each package has all the code required for the button or page (LVGL, sensors, etc)

  # Add a button the controls a light in HA

